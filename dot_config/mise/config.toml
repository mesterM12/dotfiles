[tools]
bat = "0.26"
bun = "1.4"
java = "27.0"
node = "26.10"
"npm:firebase-tools" = "15.32"
"npm:vercel" = "62.4"
pnpm = "12.9"
python = "3.14"
uv = "0.12"
bottom = "0.14"
chezmoi = "2.73"
codex = "0.160"
duf = "0.9"
dust = "1.2"
eza = "0.23"
fastfetch = "2.69"
fd = "10.5"
fzf = "0.74"
github-cli = "2.102"
gping = "1.21"
jaq = "3.1"
jq = "1.8"
lazygit = "0.66"
opencode = "1.18"
resvg = "0.48"
ripgrep = "15.2"
starship = "1.26"
tlrc = "1.13"
tmux = "3.7c"
yazi = "26.9"
zoxide = "0.10"
delta = "0.20"
neovim = "0.12"
postgres = "18.6"
turbo = "2.11"
claude = "2.1"
pipx = "1.17"
ansible = { version = "14.4", expose = ["ansible-core"] }
pi = "1.0"
age = "1.3"
age-plugin-yubikey = "0.5"
opentofu = "1.13"
restic = "0.19"
shellcheck = "0.11"
sops = "3.13"
"github:dalance/procs" = "0.14"
"pipx:yubikey-manager" = "5.9"
gcloud = "587.0"
# CLI 2026.9.0 requires a key-management endpoint absent from Vaultwarden 1.37.3.
# Keep 2026.8.0 until the server supports it; exclude this tool from upgrades.
"npm:@bitwarden/cli" = "2026.8.0"
[settings]
lockfile = true
minimum_release_age = "0s"
pin = false
idiomatic_version_file_enable_tools = ["node"]
python.uv_venv_auto = "source"
[tasks.setup-tpm]
run = """
mkdir -p ~/.tmux/plugins
if [ ! -d ~/.tmux/plugins/tpm ]; then
  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
fi
"""
[settings.npm]
package_manager = "pnpm"
