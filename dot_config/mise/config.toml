[tools]
bat = "latest"
bun = "latest"
java = "latest"
node = "lts"
"npm:firebase-tools" = "latest"
"npm:vercel" = "latest"
pnpm = "latest"
python = "latest"
uv = "latest"
bottom = "latest"
chezmoi = "latest"
codex = "latest"
duf = "latest"
dust = "latest"
eza = "0.23.5"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
github-cli = "latest"
gping = "latest"
jaq = "latest"
jq = "latest"
lazygit = "latest"
opencode = "latest"
resvg = "latest"
ripgrep = "latest"
starship = "latest"
tlrc = "latest"
tmux = "latest"
yazi = "latest"
zoxide = "latest"
delta = "latest"
neovim = "latest"
postgres = "latest"
turbo = "2.11.5"
claude = "2.1.284"
pipx = "1.17.7"
ansible = { version = "14.4.0", expose = ["ansible-core"] }
pi = "0.87.1"
age = "1.3.2"
age-plugin-yubikey = "0.5.1"
opentofu = "1.12.6"
restic = "0.19.1"
shellcheck = "0.11.0"
sops = "3.13.3"
"github:dalance/procs" = "0.14.12"
"pipx:yubikey-manager" = "5.9.2"
gcloud = "586.0.0"
[settings]
lockfile = true
minimum_release_age = "0s"
pin = true
idiomatic_version_file_enable_tools = ["node"]
python.uv_venv_auto = "source"
[tasks.setup-tpm]
run = """
mkdir -p ~/.tmux/plugins
if [ ! -d ~/.tmux/plugins/tpm ]; then
  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
fi
"""
[settings.npm]
package_manager = "pnpm"
